<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard Owner - Kafe</title>
		<!-- Menghubungkan ke file CSS yang sama -->
		<link rel="stylesheet" href="style.css" />
		<!-- Style tambahan khusus untuk Pop-up / Modal -->
		<style>
			.modal-overlay {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.5);
				z-index: 1000;
				align-items: center;
				justify-content: center;
			}
			.modal-content {
				background: #ffffff;
				padding: 2rem;
				border-radius: 1rem;
				width: 100%;
				max-width: 500px;
				box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
				position: relative;
				border: 1px solid #fef3c7;
			}
			.modal-close {
				position: absolute;
				top: 1rem;
				right: 1rem;
				background: none;
				border: none;
				font-size: 1.25rem;
				cursor: pointer;
				color: #6b7280;
			}
			.modal-close:hover {
				color: #111827;
			}
			.btn-primary {
				background-color: #b45309;
				color: white;
				border: none;
				padding: 0.5rem 1rem;
				border-radius: 0.5rem;
				font-size: 0.875rem;
				font-weight: 600;
				cursor: pointer;
				transition: background-color 0.2s;
			}
			.btn-primary:hover {
				background-color: #92400e;
			}
		</style>
	</head>
	<body>
		<div class="card owner-container" style="max-width: 900px">
			<!-- Header Dashboard Owner & Tombol Keluar -->
			<div class="dashboard-header">
				<div>
					<span class="login-title">Panel Pemilik (Owner)</span>
					<h1>Manajemen Member</h1>
				</div>
				<a href="login.html" class="btn-logout">Keluar</a>
			</div>

			<!-- Informasi Singkat & Tombol Buka Pop-up -->
			<div
				style="
					display: flex;
					justify-content: space-between;
					align-items: center;
					background: #fffbeb;
					border: 1px solid #fde68a;
					padding: 1rem;
					border-radius: 0.75rem;
					margin-bottom: 1.5rem;
				">
				<p style="margin: 0; font-size: 0.875rem; color: #92400e">
					👑 Selamat datang, Owner. Pantau seluruh data member dan kelola sistem
					kafe di sini.
				</p>
				<button
					onclick="openModal()"
					class="btn-primary"
					style="white-space: nowrap; margin-left: 1rem">
					+ Tambah Member Baru
				</button>
			</div>

			<!-- Tabel Daftar Member -->
			<div class="table-responsive">
				<table class="data-table">
					<thead>
						<tr>
							<th>ID / No. HP</th>
							<th>Nama Lengkap</th>
							<th>Total Poin</th>
							<th>Status</th>
							<th>Aksi</th>
						</tr>
					</thead>
					<tbody id="memberTableBody">
						<tr>
							<td
								colspan="5"
								style="text-align: center; color: #9ca3af; padding: 2rem">
								Memuat data member dari database...
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<!-- POP-UP MODAL (Form Tambah Member) -->
		<div id="addUserModal" class="modal-overlay">
			<div class="modal-content">
				<button onclick="closeModal()" class="modal-close">&times;</button>
				<h3
					style="
						font-size: 1.25rem;
						font-weight: 700;
						color: #78350f;
						margin-top: 0;
						margin-bottom: 1rem;
					">
					➕ Tambah Member Baru
				</h3>

				<form id="addUserForm">
					<div class="form-group">
						<label for="newId" style="font-size: 0.8rem"
							>ID Member (Contoh: M005)</label
						>
						<input
							type="text"
							id="newId"
							class="form-input"
							required
							placeholder="Masukkan ID Member" />
					</div>
					<div class="form-group">
						<label for="newName" style="font-size: 0.8rem">Nama Lengkap</label>
						<input
							type="text"
							id="newName"
							class="form-input"
							required
							placeholder="Nama lengkap pelanggan" />
					</div>
					<div class="form-group">
						<label for="newPhone" style="font-size: 0.8rem"
							>Nomor Telepon</label
						>
						<input
							type="text"
							id="newPhone"
							class="form-input"
							required
							placeholder="Contoh: 081234567890" />
					</div>
					<div class="form-group">
						<label for="newPoints" style="font-size: 0.8rem"
							>Total Poin Awal</label
						>
						<input
							type="number"
							id="newPoints"
							class="form-input"
							required
							min="0"
							value="0"
							placeholder="0" />
					</div>
					<div style="margin-top: 1.5rem">
						<button type="submit" id="submitUserBtn" class="btn-submit">
							Simpan Member Baru
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- Panggil config.js terlebih dahulu -->
		<script src="config.js"></script>
		<script>
			// Fungsi untuk Membuka & Menutup Pop-up Modal
			function openModal() {
				document.getElementById("addUserModal").style.display = "flex";
			}
			function closeModal() {
				document.getElementById("addUserModal").style.display = "none";
				document.getElementById("addUserForm").reset();
			}

			// Fungsi untuk mengambil data member saat halaman pertama kali dibuka
			async function loadMembers() {
				const tableBody = document.getElementById("memberTableBody");

				try {
					const response = await fetch(
						`${CONFIG.WEB_APP_URL}?action=getAllMembers`,
					);
					const data = await response.json();

					if (data.success && data.members.length > 0) {
						tableBody.innerHTML = "";

						data.members.forEach((member) => {
							const row = document.createElement("tr");

							const statusBadge =
								member.status === "Aktif"
									? `<span class="badge badge-active">Aktif</span>`
									: `<span class="badge badge-inactive">Nonaktif</span>`;

							const toggleButtonText =
								member.status === "Aktif" ? "Nonaktifkan" : "Aktifkan";

							row.innerHTML = `
                            <td><strong>${member.id}</strong><br><span style="font-size:0.75rem; color:#6b7280;">${member.phone}</span></td>
                            <td>${member.name}</td>
                            <td><strong>${member.points}</strong> Poin</td>
                            <td>${statusBadge}</td>
                            <td>
                                <button class="btn-action" onclick="toggleStatus('${member.id}', '${member.status}')">
                                    ${toggleButtonText}
                                </button>
                            </td>
                        `;
							tableBody.appendChild(row);
						});
					} else {
						tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #9ca3af; padding: 2rem;">Belum ada data member.</td></tr>`;
					}
				} catch (error) {
					console.error("Error:", error);
					tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 2rem;">Gagal memuat data dari server.</td></tr>`;
				}
			}

			// Fungsi untuk mengubah status Aktif / Nonaktif member
			async function toggleStatus(memberId, currentStatus) {
				const newStatus = currentStatus === "Aktif" ? "Nonaktif" : "Aktif";
				const confirmAction = confirm(
					`Apakah Anda yakin ingin mengubah status member ${memberId} menjadi ${newStatus}?`,
				);

				if (!confirmAction) return;

				try {
					const response = await fetch(CONFIG.WEB_APP_URL, {
						method: "POST",
						headers: {
							"Content-Type": "application/x-www-form-urlencoded",
						},
						body: new URLSearchParams({
							action: "toggleMemberStatus",
							memberId: memberId,
							newStatus: newStatus,
						}),
					});

					const data = await response.json();

					if (data.success) {
						alert(`Berhasil mengubah status member menjadi ${newStatus}!`);
						loadMembers();
					} else {
						alert(data.message || "Gagal mengubah status.");
					}
				} catch (error) {
					console.error("Error:", error);
					alert("Terjadi kesalahan koneksi ke server.");
				}
			}

			// Fungsi kirim data member baru ke backend
			document
				.getElementById("addUserForm")
				.addEventListener("submit", async function (e) {
					e.preventDefault();

					const newId = document.getElementById("newId").value.trim();
					const name = document.getElementById("newName").value.trim();
					const phone = document.getElementById("newPhone").value.trim();
					const points = document.getElementById("newPoints").value.trim();
					const submitBtn = document.getElementById("submitUserBtn");

					submitBtn.disabled = true;
					submitBtn.textContent = "Menyimpan...";

					try {
						const response = await fetch(CONFIG.WEB_APP_URL, {
							method: "POST",
							headers: { "Content-Type": "application/x-www-form-urlencoded" },
							body: new URLSearchParams({
								action: "addStaffOrMember",
								newId: newId,
								name: name,
								phone: phone,
								points: points,
							}),
						});

						const data = await response.json();

						if (data.success) {
							alert("Berhasil menambahkan member baru!");
							closeModal();
							loadMembers();
						} else {
							alert(data.message || "Gagal menambahkan member.");
						}
					} catch (error) {
						console.error("Error:", error);
						alert("Terjadi kesalahan koneksi ke server.");
					} finally {
						submitBtn.disabled = false;
						submitBtn.textContent = "Simpan Member Baru";
					}
				});

			window.onload = loadMembers;
		</script>
	</body>
</html>
